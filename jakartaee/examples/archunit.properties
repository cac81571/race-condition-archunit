# src/test/resources/archunit.properties に置く
# FreezingArchRule（mvn test -Darchunit.freeze=true のときだけ有効）の設定
# 既存違反の記録先。リポジトリにコミットしてチームで共有する
freeze.store.default.path=archunit_store
# 記録ファイルが無いときに新規作成してよい（初回導入時だけ true。記録をコミットしたら false に戻すと、CI で勝手に記録が作られない）
freeze.store.default.allowStoreCreation=true
# 違反を直したら記録からも自動で消す（既定 true）。ルールの文言が変わって記録を作り直したいときは一時的に freeze.refreeze=true
#freeze.refreeze=true
